name: Docker GHCR

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: bililive-go
  IMAGE_ARCH: amd64
  IMAGE_PLATFORM: linux/amd64

jobs:
  build-and-push:
    name: Build linux/amd64 image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set image tags
        run: |
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE="ghcr.io/${OWNER_LC}/${IMAGE_NAME}"
          {
            echo "IMAGE=${IMAGE}"
            echo "SHORT_SHA=${SHORT_SHA}"
            echo "TAGS=${IMAGE}:latest,${IMAGE}:sha-${SHORT_SHA}"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: '**/go.sum'

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: yarn
          cache-dependency-path: 'src/webapp/yarn.lock'

      - name: Build Web Page
        run: make build-web

      - name: Build bililive-go binary
        run: make build PLATFORM=linux ARCH=${IMAGE_ARCH}

      - name: Prepare bgo binary for Docker
        run: |
          mkdir -p docker-context/bin
          cp "bin/bililive-linux-${IMAGE_ARCH}" docker-context/bin/bililive-go
          chmod +x docker-context/bin/bililive-go
          ls -la docker-context/bin/

      - name: Cache built-in tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: docker-tools-cache/${{ env.IMAGE_ARCH }}
          key: docker-tools-${{ env.IMAGE_ARCH }}-${{ hashFiles('src/tools/remote-tools-config.json', 'scripts/docker-prepare-tools.mjs') }}

      - name: Pre-download built-in tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: node scripts/docker-prepare-tools.mjs "${IMAGE_ARCH}" "docker-tools-cache/${IMAGE_ARCH}"

      - name: Copy tools to docker-context
        run: |
          mkdir -p docker-context/tools
          cp -r "docker-tools-cache/${IMAGE_ARCH}/"* docker-context/tools/ 2>/dev/null || true

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.IMAGE_PLATFORM }}
          push: true
          tags: ${{ env.TAGS }}
          cache-from: type=gha,scope=ghcr-${{ env.IMAGE_ARCH }}
          cache-to: type=gha,mode=max,scope=ghcr-${{ env.IMAGE_ARCH }}

      - name: Print image
        run: |
          echo "Published:"
          echo "  ${IMAGE}:latest"
          echo "  ${IMAGE}:sha-${SHORT_SHA}"
